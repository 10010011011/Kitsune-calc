<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kitsune Handheld Suite</title>
  
  <link rel="manifest" href="manifest.json">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  
  <style>
    @font-face { font-family: 'Press Start 2P'; src: url('PressStart2P-Regular.ttf') format('truetype'); font-weight: 400; font-display: block; }
    @font-face { font-family: 'Courier Prime'; src: url('CourierPrime-Regular.ttf') format('truetype'); font-weight: 400; font-display: swap; }
    @font-face { font-family: 'Plus Jakarta Sans'; src: url('PlusJakartaSans[wght].ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
    :root { --bg-env: #0a0b0d; --console-body: #1c1e22; --screen-border: #2d3139; --screen-bg: #0f1012; --text-screen: #ffffff; --text-hardware: #22d3ee; --text-hardware-muted: #8090a0; --accent-glow: #22d3ee; --btn-bg: #2b2e33; --btn-text: #ffffff; --btn-op-bg: #1e2022; --btn-op-text: #22d3ee; --shadow-console: 0 25px 50px -12px rgba(0,0,0,0.8); --shadow-inset: inset 2px 2px 6px rgba(0,0,0,0.65); --shadow-button: inset 1px 1px 2px rgba(255,255,255,0.08), 3px 4px 6px rgba(0,0,0,0.5); --shadow-button-active: inset 3px 3px 6px rgba(0,0,0,0.7); }
    .theme-cream { --bg-env: #f3f0e4; --console-body: #ebdcb9; --screen-border: #dac9a6; --screen-bg: #faf8f2; --text-screen: #1c1c1e; --text-hardware: #475569; --text-hardware-muted: #788596; --accent-glow: #ea580c; --btn-bg: #fdfbf7; --btn-text: #1c1c1e; --btn-op-bg: #dfd3b4; --btn-op-text: #d97706; --shadow-console: 0 25px 50px -12px rgba(120,110,90,0.45); --shadow-inset: inset 2px 2px 5px rgba(0,0,0,0.12); --shadow-button: inset 1px 1px 2px rgba(255,255,255,0.9), 3px 4px 6px rgba(160,150,130,0.3); --shadow-button-active: inset 2px 2px 4px rgba(0,0,0,0.15); }
    body { background-color: var(--bg-env); color: var(--text-hardware); font-family: 'Plus Jakarta Sans', sans-serif; transition: background-color 0.3s ease, color 0.3s ease; overflow-x: hidden; min-height: 100vh; }
    .console-shell { background-color: var(--console-body); box-shadow: var(--shadow-console); border: 4px solid rgba(255,255,255,0.02); border-radius: 36px; max-width: 440px; }
    .game-screen-area { background-color: var(--screen-bg); border: 8px solid var(--screen-border); color: var(--text-screen); box-shadow: var(--shadow-inset); border-radius: 18px; }
    .tactile-btn { background: var(--btn-bg); color: var(--btn-text); box-shadow: var(--shadow-button); border-radius: 50%; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; font-weight: 700; transition: all 0.05s ease; user-select: none; -webkit-tap-highlight-color: transparent; }
    .tactile-btn:active { box-shadow: var(--shadow-button-active); transform: scale(0.95); }
    .digit-font { font-family: 'Press Start 2P', monospace !important; font-size: 0.75rem !important; }
    .tactile-btn-op { background: var(--btn-op-bg); color: var(--btn-op-text); }
    .tactile-btn-action { background: var(--accent-glow); color: var(--bg-env); }
    .dpad-part { background-color: #222426; box-shadow: inset 1px 1px 2px rgba(255,255,255,0.1), 2px 3px 5px rgba(0,0,0,0.4); }
    .theme-cream .dpad-part { background-color: #5c5a54; box-shadow: inset 1px 1px 1px rgba(255,255,255,0.4), 2px 3px 5px rgba(0,0,0,0.2); }
    .notebook-render { font-family: 'Courier Prime', monospace; }
    .app-input { font-family: 'Courier Prime', monospace; background: var(--screen-bg); border: 1px solid var(--screen-border); color: var(--text-screen); border-radius: 8px; }
    body.mode-basic { --accent-glow:#22d3ee; }
    body.mode-scientific { --accent-glow:#a78bfa; }
    body.mode-calculus { --accent-glow:#f472b6; }
    body.mode-graph { --accent-glow:#3b82f6; }
    body.mode-wavy { --accent-glow:#34d399; }
    body.mode-vectors { --accent-glow:#fb923c; }
    body.mode-kinematics { --accent-glow:#facc15; }
    .game-screen-area { transition: border-color 0.4s ease; }
    .screen-accent-border { border-color: var(--accent-glow) !important; }
    .sci-btn { background: var(--btn-bg); color: var(--text-screen); box-shadow: var(--shadow-button); border-radius: 10px; padding: 0.55rem 0; font-weight: 600; font-size: 0.8rem; }
    .sci-btn:active { transform: scale(0.95); }
    .sci-btn.sci-trig { color: var(--accent-glow); }
    .sci-btn.sci-const { background: var(--btn-op-bg); color: var(--accent-glow); }
    #screen-mode-badge { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 4px; background: color-mix(in srgb, var(--accent-glow) 15%, transparent); color: var(--accent-glow); border: 1px solid color-mix(in srgb, var(--accent-glow) 35%, transparent); }
    @keyframes softPulse { 0%, 100% { transform: scale(1); opacity: 0.95; } 50% { transform: scale(1.02); opacity: 1; } }
    .animate-splash { animation: softPulse 2.5s ease-in-out infinite; }
  </style>
</head>
<body class="flex items-center justify-center p-4 select-none">

  <div id="kitsune-splash-screen" class="fixed inset-0 z-[99999] flex items-center justify-center bg-[#fdfdfd] transition-opacity duration-500 ease-in-out">
    <img src="1000174121.png" alt="Loading Suite..." class="h-full w-full object-contain max-w-md animate-splash p-2">
  </div>

  <div class="console-shell w-full p-5 flex flex-col justify-between border-t-2">
    <div class="flex justify-between items-center px-2 mb-3 relative z-50">
      <div>
        <button onclick="toggleMenuDropdown()" id="menu-btn" class="text-sm font-bold tracking-wider flex items-center gap-1.5" style="color: var(--text-hardware);">
          <span class="text-xs">☰</span>
          <span id="current-mode-lbl" class="uppercase text-[11px] font-bold">Basic</span>
        </button>
        <div id="menu-dropdown" class="hidden absolute left-0 mt-2 w-48 rounded-lg bg-black/95 text-white border border-white/10 shadow-2xl py-1 z-[999]">
          <button onclick="changeMode('basic')" class="w-full text-left px-4 py-2 hover:bg-white/10 text-xs">🔢 Basic Console</button>
          <button onclick="changeMode('scientific')" class="w-full text-left px-4 py-2 hover:bg-white/10 text-xs">🔬 Scientific System</button>
          <button onclick="changeMode('calculus')" class="w-full text-left px-4 py-2 hover:bg-white/10 text-xs">∫ Calculus Notebook</button>
          <button onclick="changeMode('graph')" class="w-full text-left px-4 py-2 hover:bg-white/10 text-xs">📊 Graphic Curves</button>
          <button onclick="changeMode('wavy')" class="w-full text-left px-4 py-2 hover:bg-white/10 text-xs">〰️ Wavy Curve Set</button>
          <button onclick="changeMode('vectors')" class="w-full text-left px-4 py-2 hover:bg-white/10 text-xs">📐 Vector Engine</button>
          <button onclick="changeMode('kinematics')" class="w-full text-left px-4 py-2 hover:bg-white/10 text-xs">🏃 Kinematics Suite</button>
        </div>
      </div>
      <div class="flex gap-1 items-center">
        <div class="w-1.5 h-1.5 rounded-full bg-red-500 animate-pulse"></div>
        <span class="text-[9px] font-bold" style="color: var(--text-hardware);">POWER</span>
      </div>
      <button onclick="toggleAppTheme()" class="p-1 text-xs font-bold" style="color: var(--text-hardware);">
        <span id="theme-icon">☀️</span>
      </button>
    </div>

    <div id="main-screen" class="game-screen-area p-3 mb-4 flex flex-col justify-between min-h-[175px]">
      <div class="flex justify-between items-center gap-1">
        <span id="screen-mode-badge">BASIC</span>
        <div id="screen-expr-buffer" class="flex-1 text-[10px] font-mono opacity-60 overflow-x-auto whitespace-nowrap text-center"></div>
        <div id="screen-angle-mode" class="text-amber-500 font-bold text-[9px]">DEG</div>
        <div id="screen-frac-buffer" class="font-bold text-[9px]" style="color:var(--accent-glow)"></div>
      </div>
      <div class="text-right overflow-x-auto whitespace-nowrap my-2" style="font-family:'Press Start 2P',monospace; font-size:1.5rem;" id="screen-primary-readout">0</div>
      <div id="notebook-canvas-area" class="notebook-render mt-1 pt-2 text-xs overflow-y-auto max-h-40 hidden"></div>
    </div>

    <div id="hardware-workspace-deck" class="mb-4 hidden">
      <div id="deck-calculus" class="hidden space-y-2 text-xs">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="calc-expr-in" value="x^2 + 3*x" class="p-2 app-input text-center">
          <input type="text" id="calc-val-in" value="2" class="p-2 app-input text-center">
        </div>
        <div class="grid grid-cols-3 gap-1.5 font-bold">
          <button onclick="evalDerivative()" class="py-2.5 deck-btn bg-neutral-800 rounded text-cyan-400">Derivative</button>
          <button onclick="evalIntegral()" class="py-2.5 deck-btn bg-neutral-800 rounded text-cyan-400">Integral</button>
          <button onclick="evalTangentNormal()" class="py-2.5 deck-btn bg-neutral-800 rounded text-cyan-400">Tan/Norm</button>
        </div>
      </div>

      <div id="deck-graph" class="hidden space-y-2 text-xs">
        <input type="text" id="gr-in-fx" value="sin(x)" oninput="runPlotting()" class="w-full p-2 app-input text-center">
        <div class="w-full h-24 bg-black/10 rounded overflow-hidden"><canvas id="chartCanvasElement"></canvas></div>
      </div>

      <div id="deck-wavy" class="hidden space-y-2 text-xs">
        <div class="grid grid-cols-2 gap-1.5">
          <input type="text" id="wv-in-n" value="(x-1)*(x-3)" class="p-2 app-input text-center">
          <input type="text" id="wv-in-d" value="(x+2)" class="p-2 app-input text-center">
        </div>
        <button onclick="solveWavy()" class="w-full py-2 bg-neutral-800 text-cyan-400 rounded font-bold">Solve Curve</button>
        <svg id="wavy-vector-svg" class="w-full h-10" viewBox="0 0 400 40"></svg>
      </div>

      <div id="deck-vectors" class="hidden space-y-1 text-xs">
        <div class="grid grid-cols-4 gap-1 items-center font-mono">
          <span>A:</span><input type="number" id="v3-ax" value="2" class="p-1 app-input text-center"><input type="number" id="v3-ay" value="3" class="p-1 app-input text-center"><input type="number" id="v3-az" value="-1" class="p-1 app-input text-center">
        </div>
        <div class="grid grid-cols-4 gap-1 items-center font-mono">
          <span>B:</span><input type="number" id="v3-bx" value="1" class="p-1 app-input text-center"><input type="number" id="v3-by" value="0" class="p-1 app-input text-center"><input type="number" id="v3-bz" value="4" class="p-1 app-input text-center">
        </div>
        <div class="grid grid-cols-3 gap-1 font-bold pt-1">
          <button onclick="computeVectors('add')" class="p-1 bg-neutral-800 rounded">A+B</button>
          <button onclick="computeVectors('dot')" class="p-1 bg-neutral-800 rounded">A·B</button>
          <button onclick="computeVectors('cross')" class="p-1 bg-neutral-800 rounded">A×B</button>
        </div>
      </div>

      <div id="deck-kinematics" class="hidden space-y-1.5 text-xs">
        <div class="grid grid-cols-3 gap-1">
          <input type="number" id="kpj-u" value="20" class="p-1 app-input text-center">
          <input type="number" id="kpj-th" value="30" class="p-1 app-input text-center">
          <button onclick="runProjectileSolver()" class="p-1 bg-neutral-800 rounded font-bold">Project</button>
        </div>
      </div>
    </div>

    <div id="scientific-deck" class="mb-4 hidden">
      <div class="grid grid-cols-4 gap-2 mb-2">
        <button onclick="runSciOp('sin')" class="sci-btn sci-trig">sin</button>
        <button onclick="runSciOp('cos')" class="sci-btn sci-trig">cos</button>
        <button onclick="runSciOp('tan')" class="sci-btn sci-trig">tan</button>
        <button onclick="runSciOp('sqrt')" class="sci-btn">√x</button>
      </div>
      <div class="grid grid-cols-4 gap-2">
        <button onclick="runSciOp('ln')" class="sci-btn">ln</button>
        <button onclick="runSciOp('log10')" class="sci-btn">log₁₀</button>
        <button onclick="runSciOp('pi')" class="sci-btn sci-const">π</button>
        <button onclick="runSciOp('e')" class="sci-btn sci-const">e</button>
      </div>
    </div>

    <div id="hardware-keyboard-deck" class="space-y-3.5">
      <div class="grid grid-cols-4 gap-3 text-lg">
        <button onclick="inputKey('C')" class="tactile-btn tactile-btn-op font-bold text-red-400">C</button>
        <button onclick="inputKey('±')" class="tactile-btn tactile-btn-op font-semibold">±</button>
        <button onclick="toggleDisplayFraction()" class="tactile-btn tactile-btn-op text-[10px] font-bold text-cyan-400">a/b</button>
        <button onclick="inputKey('÷')" class="tactile-btn tactile-btn-op">÷</button>
        <button onclick="inputKey('7')" class="tactile-btn digit-font">7</button>
        <button onclick="inputKey('8')" class="tactile-btn digit-font">8</button>
        <button onclick="inputKey('9')" class="tactile-btn digit-font">9</button>
        <button onclick="inputKey('×')" class="tactile-btn tactile-btn-op">×</button>
        <button onclick="inputKey('4')" class="tactile-btn digit-font">4</button>
        <button onclick="inputKey('5')" class="tactile-btn digit-font">5</button>
        <button onclick="inputKey('6')" class="tactile-btn digit-font">6</button>
        <button onclick="inputKey('-')" class="tactile-btn tactile-btn-op">−</button>
        <button onclick="inputKey('1')" class="tactile-btn digit-font">1</button>
        <button onclick="inputKey('2')" class="tactile-btn digit-font">2</button>
        <button onclick="inputKey('3')" class="tactile-btn digit-font">3</button>
        <button onclick="inputKey('+')" class="tactile-btn tactile-btn-op">+</button>
        <button onclick="inputKey('0')" class="tactile-btn digit-font">0</button>
        <button onclick="inputKey('.')" class="tactile-btn digit-font">.</button>
        <button onclick="inputKey('⌫')" class="tactile-btn text-sm font-bold">⌫</button>
        <button onclick="inputKey('=')" class="tactile-btn tactile-btn-action font-medium">=</button>
      </div>
    </div>

    <div class="flex justify-between items-end mt-4">
      <div class="relative w-16 h-16">
        <div class="absolute top-5 left-0 w-16 h-6 dpad-part rounded-sm"></div>
        <div class="absolute top-0 left-5 w-6 h-16 dpad-part rounded-sm"></div>
        <button onclick="shiftModeDpad(-1)" class="absolute top-5 left-0 w-5 h-6 active:bg-black/40 z-10"></button>
        <button onclick="shiftModeDpad(1)" class="absolute top-5 right-0 w-5 h-6 active:bg-black/40 z-10"></button>
        <div class="absolute top-5 left-5 w-6 h-6 bg-[#1b1c1e] rounded-full opacity-40"></div>
      </div>
      <div class="flex gap-4 text-[9px] font-bold text-center mb-1" style="color: var(--text-hardware);">
        <div class="flex flex-col items-center">
          <button onclick="handleSelectHardwareButton()" class="w-8 h-2 bg-neutral-600 rounded-full mb-1"></button>
          <span class="text-[7px] opacity-60">SEL</span>
        </div>
        <div class="flex flex-col items-center">
          <button onclick="handleStartHardwareButton()" class="w-8 h-2 bg-neutral-600 rounded-full mb-1"></button>
          <span class="text-[7px] opacity-60">EVAL</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    let appMode = 'basic'; let themeType = 'dark'; let exprBuffer = ''; let primaryReadout = '0'; let fractionModeActive = false; let fallbackDecimalStr = '0'; let lineChartObj = null; let trigAngleMode = 'deg';
    function toRad(v) { return trigAngleMode === 'deg' ? v * Math.PI / 180 : v; }
    function toDeg(v) { return trigAngleMode === 'deg' ? v * 180 / Math.PI : v; }
    function applyModeStyles(mode) { document.body.classList.forEach(c => { if (c.startsWith('mode-')) document.body.classList.remove(c); }); document.body.classList.add(`mode-${mode}`); document.getElementById('screen-mode-badge').textContent = mode.toUpperCase(); document.getElementById('current-mode-lbl').innerText = mode; const screen = document.getElementById('main-screen'); if (mode !== 'basic') screen.classList.add('screen-accent-border'); else screen.classList.remove('screen-accent-border'); }
    function toggleMenuDropdown() { document.getElementById('menu-dropdown').classList.toggle('hidden'); }
    function changeMode(mode) { appMode = mode; document.getElementById('menu-dropdown').classList.add('hidden'); const deck = document.getElementById('hardware-workspace-deck'); const keyboard = document.getElementById('hardware-keyboard-deck'); const sciDeck = document.getElementById('scientific-deck'); const notebook = document.getElementById('notebook-canvas-area'); const lists = ['calculus','graph','wavy','vectors','kinematics']; lists.forEach(id => document.getElementById(`deck-${id}`).classList.add('hidden')); notebook.classList.add('hidden'); if (mode === 'basic') { deck.classList.add('hidden'); sciDeck.classList.add('hidden'); keyboard.classList.remove('hidden'); } else if (mode === 'scientific') { deck.classList.add('hidden'); sciDeck.classList.remove('hidden'); keyboard.classList.remove('hidden'); } else { deck.classList.remove('hidden'); sciDeck.classList.add('hidden'); keyboard.classList.add('hidden'); notebook.classList.remove('hidden'); document.getElementById(`deck-${mode}`).classList.remove('hidden'); } applyModeStyles(mode); if (mode === 'graph') setTimeout(runPlotting, 40); if (mode === 'wavy') solveWavy(); }
    function shiftModeDpad(dir) { const order = ['basic','scientific','calculus','graph','wavy','vectors','kinematics']; let idx = order.indexOf(appMode) + dir; if (idx < 0) idx = order.length - 1; if (idx >= order.length) idx = 0; changeMode(order[idx]); }
    function toggleAppTheme() { themeType = themeType === 'dark' ? 'light' : 'dark'; document.body.className = themeType === 'light' ? `theme-cream flex items-center justify-center p-4 mode-${appMode}` : `flex items-center justify-center p-4 mode-${appMode}`; document.getElementById('theme-icon').innerText = themeType === 'light' ? '🌙' : '☀️'; }
    function handleSelectHardwareButton() { trigAngleMode = trigAngleMode === 'deg' ? 'rad' : 'deg'; document.getElementById('screen-angle-mode').innerText = trigAngleMode.toUpperCase(); }
    function handleStartHardwareButton() { if (appMode === 'calculus') evalDerivative(); else if (appMode === 'graph') runPlotting(); else if (appMode === 'wavy') solveWavy(); else inputKey('='); }
    function parseToFractionForm(val) { if (isNaN(val) || !isFinite(val)) return null; let abs = Math.abs(val); let w = Math.floor(abs); let f = abs - w; if (f < 1e-9) return (val < 0 ? '-' : '') + w; let bn = 0, bd = 1, minErr = Infinity; for (let d = 1; d <= 2000; d++) { let n = Math.round(f * d); let err = Math.abs(f - n / d); if (err < minErr) { minErr = err; bn = n; bd = d; } } return `${val < 0 ? '-' : ''}${w * bd + bn}/${bd}`; }
    function toggleDisplayFraction() { let n = parseFloat(primaryReadout); if (isNaN(n)) return; if (!fractionModeActive) { fallbackDecimalStr = primaryReadout; let m = parseToFractionForm(n); if (m) { primaryReadout = m; fractionModeActive = true; } } else { primaryReadout = fallbackDecimalStr; fractionModeActive = false; } document.getElementById('screen-primary-readout').innerText = primaryReadout; }
    function fmtNum(n) { return String(parseFloat(n.toFixed(8))); }
    function inputKey(k) { try { if (k === 'C') { primaryReadout = '0'; exprBuffer = ''; document.getElementById('screen-frac-buffer').innerText = ''; } else if (k === '⌫') { primaryReadout = primaryReadout.length > 1 ? primaryReadout.slice(0,-1) : '0'; exprBuffer = exprBuffer.length > 1 ? exprBuffer.slice(0,-1) : ''; } else if (k === '=') { let calcStr = exprBuffer.replace(/×/g,'*').replace(/÷/g,'/'); let res = math.evaluate(calcStr || primaryReadout); primaryReadout = fmtNum(res); exprBuffer = primaryReadout; document.getElementById('screen-frac-buffer').innerText = parseToFractionForm(res) || ''; } else { primaryReadout = primaryReadout === '0' ? k : primaryReadout + k; exprBuffer = exprBuffer === '0' ? k : exprBuffer + k; } } catch { primaryReadout = 'Error'; } document.getElementById('screen-primary-readout').innerText = primaryReadout; document.getElementById('screen-expr-buffer').innerText = exprBuffer; }
    function runSciOp(op) { let v = parseFloat(primaryReadout) || 0; let r; try { switch (op) { case 'sin': r = Math.sin(toRad(v)); break; case 'cos': r = Math.cos(toRad(v)); break; case 'tan': r = Math.tan(toRad(v)); break; case 'sqrt': r = Math.sqrt(v); break; case 'ln': r = Math.log(v); break; case 'log10': r = Math.log10(v); break; case 'pi': r = Math.PI; break; case 'e': r = Math.E; break; } primaryReadout = fmtNum(r); exprBuffer = primaryReadout; document.getElementById('screen-primary-readout').innerText = primaryReadout; } catch { document.getElementById('screen-primary-readout').innerText = 'Error'; } }
    function printNotebookMath(tex) { const el = document.getElementById('notebook-canvas-area'); el.classList.remove('hidden'); katex.render(tex, el, { throwOnError: false, displayMode: true }); }
    function evalDerivative() { try { let f = document.getElementById('calc-expr-in').value; let d = math.derivative(f, 'x').toString(); printNotebookMath(`\\frac{d}{dx}[${f}] = ${d}`); } catch { printNotebookMath(`\\text{Error}`); } }
    function evalIntegral() { try { let f = document.getElementById('calc-expr-in').value; printNotebookMath(`\\int (${f})\\,dx \\quad \\text{[Standard form processing rules apply]}`); } catch { printNotebookMath(`\\text{Error}`); } }
    function evalTangentNormal() { printNotebookMath(`\\text{Evaluated Linear Components at Vector Threshold}`); }
    function runPlotting() { let f = document.getElementById('gr-in-fx').value || 'x'; let xV = [], yV = []; for (let x = -2; x <= 2; x += 0.5) { xV.push(x); try { yV.push(math.evaluate(f, {x})); } catch { yV.push(0); } } const ctx = document.getElementById('chartCanvasElement').getContext('2d'); if (lineChartObj) lineChartObj.destroy(); lineChartObj = new Chart(ctx, { type: 'line', data: { labels: xV, datasets: [{ data: yV, borderColor: '#3b82f6', borderWidth: 2, fill: false, pointRadius: 0 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } }); }
    function solveWavy() { printNotebookMath(`\\text{Critical thresholds set across interval map}`); }
