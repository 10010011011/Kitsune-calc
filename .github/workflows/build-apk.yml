name: Shareable APK Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone WebView Native Container
        run: |
          git clone https://github.com/S64/android-webview-app-template.git native-app
          cd native-app
          
          # Inject your specific website URL directly into the application layout configuration
          sed -i 's|https://example.com|https://10010011011.github.io/Kitsune-calc/|g' app/src/main/res/values/strings.xml
          
          # Set up app name matching your suite
          sed -i 's/Web App Template/Kitsune Handheld Suite/g' app/src/main/res/values/strings.xml
          
          # Force true fullscreen mode matching your manifest intent
          sed -i '/<application/a \        android:theme="@android:style/Theme.NoTitleBar.Fullscreen"' app/src/main/AndroidManifest.xml

      - name: Compile Production APK File
        run: |
          cd native-app
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kitsune-Shareable-APK
          path: native-app/app/build/outputs/apk/release/*.apk
