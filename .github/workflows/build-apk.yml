name: Shareable APK Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Build Android App Project
        run: |
          bubblewrap init --manifest="https://10010011011.github.io/Kitsune-calc/manifest.json" --meta=options.json || true
          echo '{"domain":"10010011011.github.io","urlPath":"/Kitsune-calc/","name":"Kitsune Handheld Suite","shortName":"Kitsune","themeColor":"#22d3ee","backgroundColor":"#0a0b0d","startUrl":"https://10010011011.github.io/Kitsune-calc/index.html","icon":"https://10010011011.github.io/Kitsune-calc/imresizer-file_00000000e1bc7207bd9f7023a8dee8f0%20(1).png","signingKey":{"path":"./kitsune.keystore","alias":"kitsune"},"apkVersionCode":1,"apkVersionName":"1.0.0","display":"fullscreen","orientation":"portrait"}' > twa-manifest.json

      - name: Generate Secure App Signing Key
        run: |
          keytool -genkey -v -keystore kitsune.keystore -alias kitsune -keyalg RSA -keysize 2048 -validity 10000 -storepass kitsunepass -keypass kitsunepass -dname "CN=Kitsune, OU=Dev, O=Math, L=Bhagalpur, S=Bihar, C=IN"

      - name: Compile Signed Android APK Package
        run: |
          bubblewrap build --signingKeyPath=./kitsune.keystore --signingKeyPassword=kitsunepass --keyPairPassword=kitsunepass || true

      - name: Upload Finished APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kitsune-Shareable-APK
          path: ./**/*.apk
          
