name: Shareable APK Generator

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Generate Signing Keystore and App Blueprint
        run: |
          keytool -genkey -v -keystore kitsune.keystore -alias kitsune -keyalg RSA -keysize 2048 -validity 10000 -storepass kitsunepass -keypass kitsunepass -dname "CN=Kitsune, OU=Dev, O=Math, L=Bhagalpur, S=Bihar, C=IN"
          
          cat << 'EOF' > twa-manifest.json
          {
            "packageId": "com.kitsune.calc",
            "host": "10010011011.github.io",
            "name": "Kitsune Handheld Suite",
            "launcherName": "Kitsune",
            "display": "fullscreen",
            "themeColor": "#0a0b0d",
            "themeColorDark": "#0a0b0d",
            "navigationColor": "#0a0b0d",
            "navigationColorDark": "#0a0b0d",
            "navigationDividerColor": "#0a0b0d",
            "navigationDividerColorDark": "#0a0b0d",
            "backgroundColor": "#0a0b0d",
            "startUrl": "/Kitsune-calc/index.html",
            "iconUrl": "https://10010011011.github.io/Kitsune-calc/imresizer-file_00000000e1bc7207bd9f7023a8dee8f0%20(1).png",
            "maskableIconUrl": "https://10010011011.github.io/Kitsune-calc/imresizer-file_00000000e1bc7207bd9f7023a8dee8f0%20(1).png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "./kitsune.keystore",
              "alias": "kitsune"
            },
            "appVersionName": "1.0",
            "appVersionCode": 1,
            "appVersion": "1.0",
            "shortcuts": [],
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "https://10010011011.github.io/Kitsune-calc/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": {
              "enabled": false
            },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "minSdkVersion": 19,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF

      - name: Compile Inside Official Google Container
        run: |
          # Passing the passwords securely using -e ensures Bubblewrap never prompts for a password text input
          docker run --rm \
            -v "$PWD":/app \
            -w /app \
            -e BUBBLEWRAP_KEYSTORE_PASSWORD="kitsunepass" \
            -e BUBBLEWRAP_KEY_PASSWORD="kitsunepass" \
            --entrypoint /bin/sh \
            ghcr.io/googlechromelabs/bubblewrap:latest \
            -c "yes | bubblewrap build --skipPwaValidation"

      - name: Upload Finished APK Package
        uses: actions/upload-artifact@v4
        with:
          name: Kitsune-Shareable-APK
          path: |
            *.apk
            **/*.apk
            
